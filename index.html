<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPremium SaaS - Vitrine de Alto Padrão</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           CSS PREMIUM - PRETO E OURO
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0f0f0f;
            color: #e8e8e8;
            line-height: 1.7;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3, .section-title { font-family: 'Playfair Display', serif; font-weight: 700; }

        /* Navegação e Header */
        header {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 28px rgba(0,0,0,0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        header h1 { font-size: 1.5rem; color: #fff; }
        header span { color: #ffd700; }
        
        /* Menu Hambúrguer Suspenso */
        .nav-container { position: relative; }

        .hamburger-btn {
            background: transparent;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover { background: #ffd700; color: #000; }

        .nav-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            margin-top: 15px;
            min-width: 160px;
            z-index: 200;
        }

        .nav-menu.show { display: flex; }

        .nav-menu button {
            background: transparent;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }

        .nav-menu button:hover { background: #ffd700; color: #000; }

        /* Divisor Premium Ouro */
        .divider {
            height: 4px;
            background: linear-gradient(90deg, #b8860b 0%, #ffd700 35%, #daa520 70%, #b8860b 100%);
            width: 100%;
            box-shadow: 0 4px 18px rgba(255, 215, 0, 0.3);
        }

        /* Estrutura de Telas (SPA) */
        .view { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; }
        
        .section-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #ffd700;
            border-radius: 2px;
        }

        /* Vitrine Pública */
        .filters { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
        .filters input, .filters select { 
            flex: 1; min-width: 200px; max-width: 300px; padding: 12px 20px; 
            background: #1a1a1a; border: 1px solid #333; color: #fff; 
            border-radius: 50px; font-family: 'Montserrat', sans-serif;
        }
        .filters input:focus, .filters select:focus { outline: none; border-color: #ffd700; }

        .car-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; }

        .product {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            width: 350px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .product:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
        }

        .car-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .car-carousel::-webkit-scrollbar { display: none; }
        .car-carousel img { width: 100%; height: 250px; object-fit: cover; scroll-snap-align: center; flex: 0 0 100%; }

        .product-info { padding: 25px; text-align: center; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.4rem; color: #fff; margin-bottom: 10px; font-weight: 700; }
        
        .car-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
        .tag { background: #000; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; color: #aaa; }
        
        .product-details { font-size: 0.9rem; color: #aaa; margin-bottom: 15px; flex: 1; }
        
        .price-container { margin: 15px 0; }
        .new-price { color: #ffd700; font-size: 2rem; font-weight: 700; font-family: 'Playfair Display', serif; }

        .buy-btn {
            background: #ffd700; color: #000; border: none; padding: 15px;
            font-size: 1rem; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all 0.4s; text-transform: uppercase;
            letter-spacing: 1.5px; width: 100%; margin-top: auto;
        }
        .buy-btn:hover { background: #ffed4e; transform: scale(1.05); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4); }

        /* Painel Admin */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .dash-card { 
            background: linear-gradient(135deg, #1a1a1a, #222); 
            padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; 
        }
        .dash-card h3 { color: #aaa; font-size: 1.1rem; margin-bottom: 15px; font-family: 'Montserrat', sans-serif;}
        .dash-card p { font-size: 3rem; font-weight: bold; color: #ffd700; font-family: 'Playfair Display', serif;}

        /* Formulários Premium */
        .admin-form-container { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px; transition: all 0.3s ease;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #ccc; font-size: 0.9rem; }
        .form-control { 
            width: 100%; padding: 14px; background: #0f0f0f; border: 1px solid #444; 
            border-radius: 6px; font-size: 1rem; color: #fff; font-family: 'Montserrat', sans-serif;
        }
        .form-control:focus { outline: none; border-color: #ffd700; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        
        .btn-admin { 
            display: inline-block; padding: 14px 24px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: bold; text-align: center; font-size: 1rem; text-transform: uppercase;
        }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-primary:hover { background: #ffed4e; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #8a1c1c; color: #fff; padding: 8px 15px; font-size: 0.85rem; border-radius: 4px; }
        .btn-edit { background: #0a58ca; color: #fff; padding: 8px 15px; font-size: 0.85rem; border-radius: 4px; }
        .btn-edit:hover { background: #084298; }

        /* NOVO: CSS do Upload e Gerenciamento de Imagens */
        .file-upload-input { display: none; }
        .file-upload-btn {
            display: block; background: #0f0f0f; color: #ffd700;
            border: 2px dashed #ffd700; padding: 20px; text-align: center;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .file-upload-btn:hover { background: rgba(255, 215, 0, 0.1); transform: scale(1.02); }
        
        #image-preview-container {
            display: flex; gap: 15px; margin-top: 15px; overflow-x: auto; padding-bottom: 10px;
        }
        
        .preview-wrapper {
            position: relative; display: inline-block; flex-shrink: 0;
        }
        
        .preview-img {
            width: 80px; height: 80px; object-fit: cover;
            border-radius: 6px; border: 2px solid #444; display: block;
        }

        .remove-photo-btn {
            position: absolute; top: -8px; right: -8px;
            background: #dc3545; color: white; border: none;
            border-radius: 50%; width: 22px; height: 22px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: background 0.2s;
            line-height: 1; padding-bottom: 2px;
        }
        .remove-photo-btn:hover { background: #c82333; }

        /* Tabelas Dark */
        .table-responsive { overflow-x: auto; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; padding: 20px;}
        table { width: 100%; border-collapse: collapse; color: #ddd; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #ffd700; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; border-bottom: 2px solid #444;}
        
        .badge { padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; }
        .badge-active { background: rgba(37, 211, 102, 0.2); color: #25D366; border: 1px solid #25D366;}
        .badge-sold { background: rgba(220, 53, 69, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b;}
    </style>
</head>
<body>

    <header>
        <h1 id="brandName">AutoPremium <span>SaaS</span></h1>
        
        <div class="nav-container">
            <button class="hamburger-btn" onclick="toggleMenu()" title="Abrir Menu">☰</button>
            <div class="nav-menu" id="navMenu">
                <button onclick="navigate('vitrine')">Ver Vitrine</button>
                <button onclick="navigate('admin')">Painel Gestão</button>
            </div>
        </div>
    </header>
    <div class="divider"></div>

    <main id="view-vitrine" class="view active">
        <h2 class="section-title">Estoque</h2>
        
        <div class="filters">
            <input type="text" id="searchFilter" placeholder="Buscar veículo..." onkeyup="renderVitrine()">
            <select id="priceFilter" onchange="renderVitrine()">
                <option value="all">Filtro de Valor</option>
                <option value="100000">Até R$ 100.000</option>
                <option value="200000">Até R$ 200.000</option>
                <option value="9999999">Acima de R$ 200.000</option>
            </select>
        </div>

        <div id="publicCarGrid" class="car-grid">
            </div>
    </main>

    <main id="view-admin" class="view">
        <h2 class="section-title">Dashboard Operacional</h2>
        
        <div class="dashboard-grid">
            <div class="dash-card">
                <h3>Total de Leads Gerados</h3>
                <p id="totalLeadsCount">0</p>
            </div>
            <div class="dash-card">
                <h3>Veículos no Acervo</h3>
                <p id="activeCarsCount">0</p>
            </div>
        </div>

        <div style="display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap;">
            <button class="btn-admin btn-primary" onclick="abrirFormNovoCadastro()">+ Cadastrar Veículo</button>
            <button class="btn-admin btn-secondary" onclick="navigate('config')" style="border: 1px solid #ffd700;">✏️ Editar Nome no Topo e Contato</button>
        </div>

        <div id="formAddCar" class="admin-form-container" style="display: none;">
            <h3 id="formTitle" style="color: #ffd700; margin-bottom: 20px; font-family: 'Playfair Display', serif; font-size: 1.5rem;">Novo Cadastro</h3>
            <form id="carForm" onsubmit="salvarCarro(event)">
                <div class="form-group">
                    <label>Modelo do Veículo</label>
                    <input type="text" id="c_nome" class="form-control" placeholder="Ex: Porsche 911 Carrera" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="number" id="c_ano" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="c_preco" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Quilometragem</label>
                        <input type="number" id="c_km" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Cor</label>
                        <input type="text" id="c_cor" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Diferenciais (Descrição)</label>
                    <textarea id="c_desc" class="form-control" maxlength="300" placeholder="Histórico de revisões, pacotes opcionais..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Fotos do Veículo (Selecione múltiplas imagens)</label>
                    <div>
                        <input type="file" id="c_fotos_upload" accept="image/*" multiple class="file-upload-input" onchange="processarImagens(event)" onclick="this.value=null;">
                        <label for="c_fotos_upload" class="file-upload-btn">📸 Clique para Adicionar Imagens</label>
                    </div>
                    <div id="image-preview-container"></div>
                    <small style="color: #aaa; margin-top: 5px; display: block;">Você pode adicionar novas fotos ou remover as existentes clicando no "×" vermelho.</small>
                </div>

                <div style="display: flex; gap: 15px;">
                    <button type="submit" id="btnSubmitCar" class="btn-admin btn-primary">Salvar no Acervo</button>
                    <button type="button" class="btn-admin btn-secondary" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Veículo</th>
                        <th>Valor</th>
                        <th>Interessados</th>
                        <th>Status</th>
                        <th>Gestão</th>
                    </tr>
                </thead>
                <tbody id="adminCarTable"></tbody>
            </table>
        </div>
    </main>

    <main id="view-config" class="view">
        <div class="admin-form-container" style="max-width: 600px; margin: 0 auto;">
            <h2 class="section-title" style="font-size: 2rem;">Ajustes da Marca</h2>
            <form onsubmit="salvarConfig(event)">
                
                <div class="form-group">
                    <label>Nome Principal no Topo (Cor Branca)</label>
                    <input type="text" id="conf_nome" class="form-control" placeholder="Ex: AutoPremium" required>
                </div>
                <div class="form-group">
                    <label>Palavra Destaque no Topo (Cor Dourada)</label>
                    <input type="text" id="conf_sufixo" class="form-control" placeholder="Ex: SaaS ou Motors">
                </div>

                <div class="form-group" style="margin-top: 30px;">
                    <label>WhatsApp Comercial (Recebimento de Leads)</label>
                    <input type="text" id="conf_whats" class="form-control" placeholder="Ex: 5511999999999" required>
                </div>
                <button type="submit" class="btn-admin btn-primary" style="width: 100%;">Atualizar Sistema</button>
            </form>
        </div>
    </main>

    <script>
        // Dados do App
        let appData = JSON.parse(localStorage.getItem('autoPremiumData')) || {
            config: { nomeLoja: "Motors Premium", sufixoLoja: "SaaS", whatsapp: "5511900000000" },
            carros: [], totalLeads: 0
        };

        // --- SISTEMA DE MENU HAMBÚRGUER ---
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.hamburger-btn')) {
                var menu = document.getElementById("navMenu");
                if (menu.classList.contains('show')) {
                    menu.classList.remove('show');
                }
            }
        }
        // ----------------------------------

        // --- SISTEMA AVANÇADO DE IMAGENS (UPLOAD E REMOÇÃO) ---
        let fotosTemporarias = [];
        let carroEmEdicaoId = null; 

        // Lê os arquivos selecionados e ADICIONA ao array existente
        function processarImagens(event) {
            const files = event.target.files;
            if(files.length === 0) return;

            let filesProcessed = 0;
            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const base64Str = e.target.result;
                    fotosTemporarias.push(base64Str);
                    filesProcessed++;
                    
                    // Renderiza as miniaturas apenas quando terminar de ler todas
                    if(filesProcessed === files.length) {
                        renderizarMiniaturas();
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Remove a foto escolhida pelo índice no array
        function removerFotoTemporaria(index) {
            fotosTemporarias.splice(index, 1);
            renderizarMiniaturas();
        }

        // Reconstrói a interface das miniaturas sempre que adiciona ou remove fotos
        function renderizarMiniaturas() {
            const previewContainer = document.getElementById('image-preview-container');
            previewContainer.innerHTML = ''; 

            fotosTemporarias.forEach((fotoBase64, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'preview-wrapper';

                const img = document.createElement('img');
                img.src = fotoBase64;
                img.className = 'preview-img';

                const btnRemover = document.createElement('button');
                btnRemover.className = 'remove-photo-btn';
                btnRemover.innerHTML = '×';
                btnRemover.type = 'button'; // Previne envio do form
                btnRemover.onclick = () => removerFotoTemporaria(index);

                wrapper.appendChild(img);
                wrapper.appendChild(btnRemover);
                previewContainer.appendChild(wrapper);
            });
        }
        // ----------------------------------------------------
        
        // --- FUNÇÕES DE CONTROLE DE CARROS ---
        function abrirFormNovoCadastro() {
            cancelarEdicao(); 
            document.getElementById('formAddCar').style.display = 'block';
        }

        function editarCarro(id) {
            const carro = appData.carros.find(c => c.id === id);
            if(!carro) return;

            carroEmEdicaoId = id; 

            document.getElementById('c_nome').value = carro.nome;
            document.getElementById('c_ano').value = carro.ano;
            document.getElementById('c_preco').value = carro.preco;
            document.getElementById('c_km').value = carro.km;
            document.getElementById('c_cor').value = carro.cor || "";
            document.getElementById('c_desc').value = carro.desc || "";

            // Carrega as fotos existentes ou limpa se for placeholder
            if (!carro.fotos[0].includes('via.placeholder.com')) {
                fotosTemporarias = [...carro.fotos];
            } else {
                fotosTemporarias = [];
            }
            
            // Desenha as fotos salvas com o botão de excluir
            renderizarMiniaturas();

            document.getElementById('formTitle').innerText = "Editar Veículo";
            document.getElementById('btnSubmitCar').innerText = "Salvar Alterações";
            
            document.getElementById('formAddCar').style.display = 'block';
            document.getElementById('formAddCar').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById('carForm').reset();
            document.getElementById('image-preview-container').innerHTML = '';
            fotosTemporarias = [];
            carroEmEdicaoId = null; 

            document.getElementById('formTitle').innerText = "Novo Cadastro";
            document.getElementById('btnSubmitCar').innerText = "Salvar no Acervo";
            document.getElementById('formAddCar').style.display = 'none';
        }

        function saveData() {
            localStorage.setItem('autoPremiumData', JSON.stringify(appData));
            atualizarInterface();
        }

        function navigate(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.getElementById('navMenu').classList.remove('show');

            if(viewId === 'config') preencherFormConfig();
            window.scrollTo(0, 0);
        }

        function preencherFormConfig() {
            document.getElementById('conf_nome').value = appData.config.nomeLoja || "";
            document.getElementById('conf_sufixo').value = appData.config.sufixoLoja || "";
            document.getElementById('conf_whats').value = appData.config.whatsapp || "";
        }

        function salvarConfig(e) {
            e.preventDefault();
            appData.config.nomeLoja = document.getElementById('conf_nome').value;
            appData.config.sufixoLoja = document.getElementById('conf_sufixo').value;
            appData.config.whatsapp = document.getElementById('conf_whats').value;
            saveData();
            navigate('admin');
        }

        function salvarCarro(e) {
            e.preventDefault();

            const fotosArray = fotosTemporarias.length > 0 
                ? [...fotosTemporarias] 
                : ["https://via.placeholder.com/600x400/1a1a1a/ffd700?text=Sem+Foto"];

            if (carroEmEdicaoId) {
                // EDITAR
                const index = appData.carros.findIndex(c => c.id === carroEmEdicaoId);
                if (index !== -1) {
                    appData.carros[index].nome = document.getElementById('c_nome').value;
                    appData.carros[index].ano = document.getElementById('c_ano').value;
                    appData.carros[index].preco = Number(document.getElementById('c_preco').value);
                    appData.carros[index].km = document.getElementById('c_km').value;
                    appData.carros[index].cor = document.getElementById('c_cor').value;
                    appData.carros[index].desc = document.getElementById('c_desc').value;
                    appData.carros[index].fotos = fotosArray;
                }
            } else {
                // CRIAR NOVO
                const novoCarro = {
                    id: Date.now(),
                    nome: document.getElementById('c_nome').value,
                    ano: document.getElementById('c_ano').value,
                    preco: Number(document.getElementById('c_preco').value),
                    km: document.getElementById('c_km').value,
                    cor: document.getElementById('c_cor').value,
                    desc: document.getElementById('c_desc').value,
                    fotos: fotosArray, 
                    status: 'ativo', leads: 0
                };
                appData.carros.push(novoCarro);
            }

            saveData();
            cancelarEdicao(); 
        }

        function removerCarro(id) {
            if(confirm("Remover este veículo do acervo de forma permanente?")) {
                appData.carros = appData.carros.filter(c => c.id !== id);
                saveData();
            }
        }

        function marcarVendido(id) {
            const carro = appData.carros.find(c => c.id === id);
            if(carro) { carro.status = carro.status === 'ativo' ? 'vendido' : 'ativo'; saveData(); }
        }

        function gerarLead(carroId) {
            const carro = appData.carros.find(c => c.id === carroId);
            if(!carro) return;
            carro.leads += 1; appData.totalLeads += 1; saveData();
            const precoFormatado = carro.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const msg = `Olá! Vi o ${carro.nome} (${carro.ano}) por ${precoFormatado} no acervo da ${appData.config.nomeLoja}. Tenho interesse.`;
            window.open(`https://wa.me/${appData.config.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function atualizarInterface() {
            const nomeStr = appData.config.nomeLoja || "AutoPremium";
            const sufixoStr = appData.config.sufixoLoja ? `<span>${appData.config.sufixoLoja}</span>` : "";
            document.getElementById('brandName').innerHTML = `${nomeStr} ${sufixoStr}`;
            
            document.getElementById('totalLeadsCount').innerText = appData.totalLeads;
            document.getElementById('activeCarsCount').innerText = appData.carros.filter(c => c.status === 'ativo').length;
            
            renderAdminTable(); 
            renderVitrine();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminCarTable');
            tbody.innerHTML = '';
            const carrosOrdenados = [...appData.carros].sort((a, b) => b.leads - a.leads);

            carrosOrdenados.forEach(carro => {
                const tr = document.createElement('tr');
                const badgeClass = carro.status === 'ativo' ? 'badge-active' : 'badge-sold';
                const statusText = carro.status === 'ativo' ? 'Disponível' : 'Vendido';
                const precoFmt = carro.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                tr.innerHTML = `
                    <td><strong>${carro.nome}</strong><br><span style="color:#aaa; font-size:0.85rem">${carro.ano}</span></td>
                    <td style="color:#ffd700; font-weight:bold;">${precoFmt}</td>
                    <td><strong style="color:#fff; font-size:1.1rem;">${carro.leads}</strong> cliques</td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                    <td>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            <button class="btn-admin btn-secondary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="marcarVendido(${carro.id})">Alt. Status</button>
                            <button class="btn-admin btn-edit" onclick="editarCarro(${carro.id})">Editar</button>
                            <button class="btn-admin btn-danger" onclick="removerCarro(${carro.id})">Excluir</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderVitrine() {
            const grid = document.getElementById('publicCarGrid');
            grid.innerHTML = '';
            const termoBusca = document.getElementById('searchFilter').value.toLowerCase();
            const precoMax = document.getElementById('priceFilter').value;
            let carrosVisiveis = appData.carros.filter(c => c.status === 'ativo');

            if(termoBusca) carrosVisiveis = carrosVisiveis.filter(c => c.nome.toLowerCase().includes(termoBusca));
            if(precoMax !== 'all') carrosVisiveis = carrosVisiveis.filter(c => c.preco <= Number(precoMax));

            if(carrosVisiveis.length === 0) {
                grid.innerHTML = '<p style="color:#aaa; text-align:center; width:100%;">Nenhum veículo no acervo no momento.</p>'; return;
            }

            carrosVisiveis.forEach(carro => {
                let fotosHtml = '';
                carro.fotos.forEach(foto => { fotosHtml += `<img src="${foto}" alt="${carro.nome}">`; });
                const precoFmt = carro.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                const card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <div class="car-carousel">${fotosHtml}</div>
                    <div class="product-info">
                        <h3 class="product-title">${carro.nome}</h3>
                        <div class="car-tags">
                            <span class="tag">${carro.ano}</span>
                            <span class="tag">${carro.km} km</span>
                        </div>
                        <p class="product-details">${carro.desc || 'Veículo premium em excelente estado.'}</p>
                        <div class="price-container">
                            <span class="new-price">${precoFmt}</span>
                        </div>
                        <button class="buy-btn" onclick="gerarLead(${carro.id})">Tirar Dúvidas WhatsApp</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        if(appData.carros.length === 0) {
            appData.carros.push({
                id: 1, nome: "Land Rover Evoque HSE", ano: 2022, preco: 345000, km: 22000, cor: "Preto",
                desc: "Teto panorâmico, revisões na concessionária, vitrificação 9H aplicada.",
                fotos: ["https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"],
                status: 'ativo', leads: 0
            });
            saveData();
        } else { atualizarInterface(); }
    </script>
</body>
</html>
